app = "polymarket-engine"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = 60

[build]
  dockerfile = "Dockerfile.engine"

[env]
  NODE_ENV = "production"
  TRADING_MODE = "paper"
  PORT = "8080"
  ENGINE_REGION = "fra"
  JOURNAL_MODE = "postgres"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    timeout = "3s"
    path = "/ready"

  [[http_service.checks]]
    interval = "30s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
    timeout = "3s"

[metrics]
  port = 8080
  path = "/metrics"

[[restart]]
  policy = "always"
  retries = 10

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
