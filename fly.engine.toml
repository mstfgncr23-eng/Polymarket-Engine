# Intended Fly app name. Operator must create/own this app (or pass --app).
# Secrets stay in `fly secrets`, never in this file.
# Paper MONITOR_ONLY boot: TRADING_MODE=paper, GROK_ACTIVATION_PROVIDER=noop.
# Experiment stays IDLE until an explicit operator start. Do not enable live trading.
# No Fly Managed Postgres — use operator-provisioned Supabase DATABASE_URL.
app = "polymarket-engine"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = 60

[build]
  dockerfile = "Dockerfile.engine"

[env]
  NODE_ENV = "production"
  TRADING_MODE = "paper"
  PORT = "8080"
  ENGINE_REGION = "fra"
  GROK_MCP_ALLOWED_ORIGINS = "https://grok.com,https://x.ai"
  GROK_ACTIVATION_PROVIDER = "noop"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    timeout = "3s"
    path = "/ready"

  [[http_service.checks]]
    interval = "30s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
    timeout = "3s"

[metrics]
  port = 8080
  path = "/metrics"

[[restart]]
  policy = "always"
  retries = 10

[[vm]]
  size = "shared-cpu-2x"
  memory = "512mb"
