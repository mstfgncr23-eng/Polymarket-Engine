name: PR35 one-shot retention clock fix

on:
  push:
    branches:
      - fix/polymarket-two-shard-market-ws

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/polymarket-two-shard-market-ws
          fetch-depth: 0

      - name: Patch deterministic retention clock
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/stability-step4-reporting-retention.test.ts')
          text = path.read_text()

          old_persist = '''    await journal.persistExperimentReport({\n      experimentId: "exp-1", reportKind: "final", schemaVersion: 1, generatedAt: persistedAt.toISOString(),'''
          new_persist = '''    const persisted = await journal.persistExperimentReport({\n      experimentId: "exp-1", reportKind: "final", schemaVersion: 1, generatedAt: persistedAt.toISOString(),'''
          old_now = '      now: new Date("2026-09-10T00:00:00.000Z"),'
          new_now = '      now: new Date(Date.parse(persisted.report.persistedAt) + 2),'

          if text.count(old_persist) != 1:
              raise SystemExit(f'expected exactly one persist target, got {text.count(old_persist)}')
          if text.count(old_now) != 1:
              raise SystemExit(f'expected exactly one now target, got {text.count(old_now)}')

          text = text.replace(old_persist, new_persist, 1)
          text = text.replace(old_now, new_now, 1)
          path.write_text(text)
          PY

          git diff --check
          git diff -- tests/stability-step4-reporting-retention.test.ts

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/stability-step4-reporting-retention.test.ts
          git commit -m "test: make retention grace clock deterministic"
          git push origin HEAD:fix/polymarket-two-shard-market-ws
