name: tmp-native-v2-opportunity-ranking

on:
  push:
    branches:
      - feature/native-v2-shadow-opportunity-ranking

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-v2-shadow-opportunity-ranking
          fetch-depth: 0
      - run: python3 .tmp/apply_native_v2_opportunity_ranking.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/engine/src/engine.ts packages/core/src/native-v2-shadow-opportunity-ranking.ts
          git commit -m "feat(engine): attach native v2 shadow opportunity ranking"
          git push origin HEAD:feature/native-v2-shadow-opportunity-ranking
