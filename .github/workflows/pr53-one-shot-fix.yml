name: PR53 one-shot beginExperiment fix

on:
  push:
    branches: [fix/begin-experiment-exposure-gate]
    paths:
      - .github/workflows/pr53-one-shot-fix.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    services:
      postgres-step4:
        image: postgres:17
        env:
          POSTGRES_USER: step4
          POSTGRES_PASSWORD: step4
          POSTGRES_DB: step4_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U step4 -d step4_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STEP4_TEST_DATABASE_URL: postgres://step4:step4@127.0.0.1:5432/step4_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert clean engine input
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 10b3389cfaa1395ebdeb0e33341572258855f41c HEAD
          git diff --quiet 10b3389cfaa1395ebdeb0e33341572258855f41c -- apps/engine/src/engine.ts
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact anchored engine patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("apps/engine/src/engine.ts")
          text = path.read_text()

          begin_pattern = re.compile(
              r'^(?P<i>[ \t]*)if \(!this\.state\.newPaperEntryAllowed\(\) \|\| this\.overload\.state === "FAIL_CLOSED"\) \{\n'
              r'(?P=i)  const preflight = this\.preflight\(this\.experimentMode\(\)\);\n'
              r'(?P=i)  return \{ \.\.\.preflight, ok: false, blockers: \[\.\.\.new Set\(\[\.\.\.preflight\.blockers, "OVERLOAD_FAIL_CLOSED"\]\)\] \};\n'
              r'(?P=i)\}',
              re.MULTILINE,
          )

          prepare_pattern = re.compile(
              r'^(?P<i>[ \t]*)const ledger = this\.ledger\.snapshot\(\);\n'
              r'(?P=i)const openPositions = \[\.\.\.this\.ledger\.positions\.values\(\)\]\.filter\(\(position\) => d\(position\.upQuantity\)\.gt\(0\) \|\| d\(position\.downQuantity\)\.gt\(0\)\);\n'
              r'(?P=i)const restingOrders = \[\.\.\.this\.restingOrders\.values\(\)\]\.filter\(\(order\) => d\(order\.remaining\)\.gt\(0\)\);\n'
              r'(?P=i)const makerReservations = \[\.\.\.this\.makerReservations\.entries\(\)\]\.filter\(\(\[, amount\]\) => d\(amount\)\.gt\(0\)\);\n'
              r'(?P=i)const blockers: string\[\] = \[\];\n'
              r'(?P=i)if \(openPositions\.length > 0 \|\| this\.ledger\.positions\.size > 0\) blockers\.push\("OPEN_POSITIONS_REMAIN"\);\n'
              r'(?P=i)if \(restingOrders\.length > 0 \|\| this\.restingOrders\.size > 0\) blockers\.push\("RESTING_ORDERS_REMAIN"\);\n'
              r'(?P=i)if \(makerReservations\.length > 0 \|\| this\.makerReservations\.size > 0\) blockers\.push\("MAKER_RESERVATIONS_REMAIN"\);\n'
              r'(?P=i)if \(!d\(ledger\.reservedCash\)\.eq\(0\)\) blockers\.push\("RESERVED_CASH_REMAIN"\);\n'
              r'(?P=i)if \(this\.obligationMarketIds\(\)\.size > 0\) blockers\.push\("UNRESOLVED_ECONOMIC_OBLIGATIONS"\);\n'
              r'(?P=i)if \(blockers\.length > 0\) return \{ ok: false, blockers, experiment: current \};',
              re.MULTILINE,
          )

          obligation_pattern = re.compile(
              r'^(?P<i>[ \t]*)private obligationMarketIds\(\): Set<string> \{\n'
              r'(?P=i)  const ids = this\.openPositionMarketIds\(\);\n'
              r'(?P=i)  for \(const resting of this\.restingOrders\.values\(\)\) \{\n'
              r'(?P=i)    if \(d\(resting\.remaining\)\.gt\(0\)\) ids\.add\(resting\.order\.marketId\);\n'
              r'(?P=i)  \}\n'
              r'(?P=i)  return ids;\n'
              r'(?P=i)\}',
              re.MULTILINE,
          )

          for label, pattern in [
              ("beginExperiment gate", begin_pattern),
              ("prepareNext residue block", prepare_pattern),
              ("obligation helper insertion", obligation_pattern),
          ]:
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(f"{label}: expected exactly 1 semantic anchor, found {len(matches)}")

          def begin_repl(match: re.Match[str]) -> str:
              i = match.group("i")
              return (
                  f'{i}const startBlockers = [\n'
                  f'{i}  ...(this.state.journalDegraded || this.overload.hasIntegrityFault ? ["JOURNAL_NOT_HEALTHY"] : []),\n'
                  f'{i}  ...this.experimentEconomicResidueBlockers(),\n'
                  f'{i}];\n'
                  f'{i}const entryBlocked = !this.state.newPaperEntryAllowed() || this.overload.state === "FAIL_CLOSED";\n'
                  f'{i}if (entryBlocked || startBlockers.length > 0) {{\n'
                  f'{i}  const preflight = this.preflight(this.experimentMode());\n'
                  f'{i}  return {{\n'
                  f'{i}    ...preflight,\n'
                  f'{i}    ok: false,\n'
                  f'{i}    blockers: [...new Set([\n'
                  f'{i}      ...preflight.blockers,\n'
                  f'{i}      ...startBlockers,\n'
                  f'{i}      ...(entryBlocked ? ["OVERLOAD_FAIL_CLOSED"] : []),\n'
                  f'{i}    ])],\n'
                  f'{i}  }};\n'
                  f'{i}}}'
              )

          def prepare_repl(match: re.Match[str]) -> str:
              i = match.group("i")
              return (
                  f'{i}const blockers = this.experimentEconomicResidueBlockers();\n'
                  f'{i}if (blockers.length > 0) return {{ ok: false, blockers, experiment: current }};'
              )

          def obligation_repl(match: re.Match[str]) -> str:
              i = match.group("i")
              return match.group(0) + (
                  f'\n\n{i}private experimentEconomicResidueBlockers(): string[] {{\n'
                  f'{i}  const ledger = this.ledger.snapshot();\n'
                  f'{i}  const openPositions = [...this.ledger.positions.values()].filter((position) => d(position.upQuantity).gt(0) || d(position.downQuantity).gt(0));\n'
                  f'{i}  const restingOrders = [...this.restingOrders.values()].filter((order) => d(order.remaining).gt(0));\n'
                  f'{i}  const makerReservations = [...this.makerReservations.entries()].filter(([, amount]) => d(amount).gt(0));\n'
                  f'{i}  const blockers: string[] = [];\n'
                  f'{i}  if (openPositions.length > 0 || this.ledger.positions.size > 0) blockers.push("OPEN_POSITIONS_REMAIN");\n'
                  f'{i}  if (restingOrders.length > 0 || this.restingOrders.size > 0) blockers.push("RESTING_ORDERS_REMAIN");\n'
                  f'{i}  if (makerReservations.length > 0 || this.makerReservations.size > 0) blockers.push("MAKER_RESERVATIONS_REMAIN");\n'
                  f'{i}  if (!d(ledger.reservedCash).eq(0)) blockers.push("RESERVED_CASH_REMAIN");\n'
                  f'{i}  if (this.obligationMarketIds().size > 0) blockers.push("UNRESOLVED_ECONOMIC_OBLIGATIONS");\n'
                  f'{i}  return blockers;\n'
                  f'{i}}}'
              )

          text = begin_pattern.sub(begin_repl, text, count=1)
          text = prepare_pattern.sub(prepare_repl, text, count=1)
          text = obligation_pattern.sub(obligation_repl, text, count=1)
          path.write_text(text)
          PY
          git diff --check
          git diff --stat
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke
      - name: Commit validated patch and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr53-one-shot-fix.yml
          git add apps/engine/src/engine.ts
          git diff --cached --check
          git commit -m "fix(engine): gate experiment start on economic residue"
          git push origin HEAD:fix/begin-experiment-exposure-gate
