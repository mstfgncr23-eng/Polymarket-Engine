name: temp-expired-trigger-patch

on:
  push:
    branches:
      - fix/runtime-drop-expired-trigger-backlog

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply expired trigger backlog fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-drop-expired-trigger-backlog
          fetch-depth: 0

      - name: Apply narrow runtime expiry patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # RuntimeSupervisor: carry an optional economic deadline, drop queued
          # work after that deadline before it consumes a worker, and count it
          # separately from admission rejection/failure.
          path = Path('apps/engine/src/runtime-supervisor.ts')
          text = path.read_text()

          old = '''  critical: boolean;\n  run: (signal: AbortSignal) => Promise<void>;'''
          new = '''  critical: boolean;\n  /** Economic deadline copied from TriggerEvent.expiresAt. Expired queued work is obsolete and must not consume a worker. */\n  expiresAtMs?: number;\n  run: (signal: AbortSignal) => Promise<void>;'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''  incRejected(lane: WorkLane, reason: RejectionReason): void;\n  incFailed(lane: WorkLane): void;'''
          new = '''  incRejected(lane: WorkLane, reason: RejectionReason): void;\n  incFailed(lane: WorkLane): void;\n  incExpired(lane: WorkLane): void;'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''  constructor(\n    private readonly metrics?: RuntimeWorkMetrics,\n    private readonly onChange?: () => void,\n  ) {}'''
          new = '''  constructor(\n    private readonly metrics?: RuntimeWorkMetrics,\n    private readonly onChange?: () => void,\n    private readonly nowMs: () => number = () => Date.now(),\n  ) {}'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''  admit(work: RuntimeWork): AdmitResult {\n    if (this.closed) {\n      this.publish();\n      return { admitted: false, reason: "admission_closed", done: Promise.resolve() };\n    }\n    const limit = RUNTIME_BOUNDS.trigger[work.lane].queueLimit;'''
          new = '''  admit(work: RuntimeWork): AdmitResult {\n    if (this.closed) {\n      this.publish();\n      return { admitted: false, reason: "admission_closed", done: Promise.resolve() };\n    }\n    // A backlog must never preserve trading decisions beyond their own economic\n    // deadline. Prune before the hard-cap check so obsolete work cannot force a\n    // fresh trigger into queue_full / FAIL_CLOSED.\n    if (this.pruneExpiredQueued(this.nowMs())) this.publish();\n    const limit = RUNTIME_BOUNDS.trigger[work.lane].queueLimit;'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''  private pump(): void {\n    for (;;) {\n      const next = this.pickNext();'''
          new = '''  private pump(): void {\n    if (this.pruneExpiredQueued(this.nowMs())) this.publish();\n    for (;;) {\n      const next = this.pickNext();'''
          assert old in text
          text = text.replace(old, new, 1)

          marker = '''  private unresolved(): number {\n    return this.queuedCount.p0 + this.queuedCount.p3 + this.inFlightCount.p0 + this.inFlightCount.p3;\n  }'''
          replacement = '''  private pruneExpiredQueued(nowMs: number): boolean {\n    let p0Changed = false;\n    let p3Changed = false;\n    for (const [key, queues] of this.queuedByKey) {\n      for (const lane of WORK_LANES) {\n        const queue = queues[lane];\n        // Runtime work for a given key/lane is admitted in trigger creation\n        // order, so expiration is monotonic at the queue head. Work without an\n        // economic deadline preserves the legacy supervisor contract.\n        while (queue.length > 0) {\n          const item = queue[0]!;\n          const expiresAtMs = item.work.expiresAtMs;\n          if (expiresAtMs == null || !Number.isFinite(expiresAtMs) || expiresAtMs > nowMs) break;\n          queue.shift();\n          this.queuedCount[lane] -= 1;\n          this.queueBytes[lane] -= item.work.estimatedBytes;\n          this.metrics?.incExpired(lane);\n          item.resolve();\n          if (lane === "p0") p0Changed = true;\n          else p3Changed = true;\n        }\n      }\n      if (queues.p0.length === 0 && queues.p3.length === 0) this.queuedByKey.delete(key);\n    }\n    if (p0Changed) this.refreshOldest("p0");\n    if (p3Changed) this.refreshOldest("p3");\n    return p0Changed || p3Changed;\n  }\n\n  private unresolved(): number {\n    return this.queuedCount.p0 + this.queuedCount.p3 + this.inFlightCount.p0 + this.inFlightCount.p3;\n  }'''
          assert marker in text
          text = text.replace(marker, replacement, 1)
          path.write_text(text)

          # Engine: pass the exact TriggerEvent expiry and use the engine's
          # injected clock for supervisor expiry checks (keeps deterministic tests valid).
          path = Path('apps/engine/src/engine.ts')
          text = path.read_text()
          old = '''    this.supervisor = new RuntimeSupervisor(this.metrics.runtimeWorkMetrics(), () => this.syncRuntimeState());'''
          new = '''    this.supervisor = new RuntimeSupervisor(this.metrics.runtimeWorkMetrics(), () => this.syncRuntimeState(), () => this.nowFn().getTime());'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''      estimatedBytes: RUNTIME_BOUNDS.triggerByteEstimate,\n      critical: lane === "p0",\n      marketEpochFence,'''
          new = '''      estimatedBytes: RUNTIME_BOUNDS.triggerByteEstimate,\n      critical: lane === "p0",\n      expiresAtMs: Date.parse(trigger.expiresAt),\n      marketEpochFence,'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)

          # Metrics: admitted-then-expired is not an admission rejection and not
          # a task failure, so expose it as its own bounded lane counter.
          path = Path('apps/engine/src/metrics.ts')
          text = path.read_text()
          old = '''  readonly runtimeWorkFailures = new Counter({\n    name: "runtime_work_failures_total",\n    help: "RuntimeSupervisor task failures by lane (no error text in labels)",\n    labelNames: ["lane"],\n    registers: [this.registry],\n  });'''
          new = '''  readonly runtimeWorkFailures = new Counter({\n    name: "runtime_work_failures_total",\n    help: "RuntimeSupervisor task failures by lane (no error text in labels)",\n    labelNames: ["lane"],\n    registers: [this.registry],\n  });\n  readonly runtimeWorkExpired = new Counter({\n    name: "runtime_work_expired_total",\n    help: "Admitted trigger work discarded from the queue after its economic deadline",\n    labelNames: ["lane"],\n    registers: [this.registry],\n  });'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''      this.runtimeWorkFailures.inc({ lane }, 0);\n      for (const reason of REJECTION_REASONS) this.runtimeWorkRejected.inc({ lane, reason }, 0);'''
          new = '''      this.runtimeWorkFailures.inc({ lane }, 0);\n      this.runtimeWorkExpired.inc({ lane }, 0);\n      for (const reason of REJECTION_REASONS) this.runtimeWorkRejected.inc({ lane, reason }, 0);'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''      incRejected: (lane: WorkLane, reason: RejectionReason) => this.runtimeWorkRejected.inc({ lane, reason }),\n      incFailed: (lane: WorkLane) => this.runtimeWorkFailures.inc({ lane }),'''
          new = '''      incRejected: (lane: WorkLane, reason: RejectionReason) => this.runtimeWorkRejected.inc({ lane, reason }),\n      incFailed: (lane: WorkLane) => this.runtimeWorkFailures.inc({ lane }),\n      incExpired: (lane: WorkLane) => this.runtimeWorkExpired.inc({ lane }),'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          cat > tests/runtime-expired-work.test.ts <<'TS'
          import { describe, expect, it } from "vitest";
          import { EngineMetrics } from "../apps/engine/src/metrics.js";
          import { RuntimeSupervisor } from "../apps/engine/src/runtime-supervisor.js";

          async function waitFor(predicate: () => boolean, timeoutMs = 1_000): Promise<void> {
            const started = Date.now();
            while (!predicate()) {
              if (Date.now() - started > timeoutMs) throw new Error("waitFor timeout");
              await new Promise((resolve) => setTimeout(resolve, 2));
            }
          }

          async function metricValue(metrics: EngineMetrics, name: string, lane: "p0" | "p3"): Promise<number> {
            const metric = metrics.registry.getSingleMetric(name);
            if (!metric) return 0;
            const data = await metric.get();
            return data.values.find((point) => point.labels.lane === lane)?.value ?? 0;
          }

          describe("RuntimeSupervisor economic expiry", () => {
            it("drops queued expired P3 work before run and resolves its done promise", async () => {
              let nowMs = 1_000;
              let release!: () => void;
              const hold = new Promise<void>((resolve) => { release = resolve; });
              const metrics = new EngineMetrics();
              const supervisor = new RuntimeSupervisor(metrics.runtimeWorkMetrics(), undefined, () => nowMs);
              const ran: string[] = [];

              const first = supervisor.admit({
                id: "first", lane: "p3", key: "market:m1", estimatedBytes: 10, critical: false,
                expiresAtMs: 10_000,
                run: async () => { ran.push("first"); await hold; },
              });
              const stale = supervisor.admit({
                id: "stale", lane: "p3", key: "market:m1", estimatedBytes: 10, critical: false,
                expiresAtMs: 2_000,
                run: async () => { ran.push("stale"); },
              });

              await waitFor(() => ran.includes("first"));
              expect(supervisor.snapshot().lanes.p3.queued).toBe(1);
              nowMs = 3_000;
              release();
              await Promise.all([first.done, stale.done]);

              expect(ran).toEqual(["first"]);
              expect(supervisor.snapshot().lanes.p3.queued).toBe(0);
              expect(await metricValue(metrics, "runtime_work_expired_total", "p3")).toBe(1);
            });

            it("drops an expired P0 head but still runs the fresh P0 behind it before P3", async () => {
              let nowMs = 1_000;
              let release!: () => void;
              const hold = new Promise<void>((resolve) => { release = resolve; });
              const metrics = new EngineMetrics();
              const supervisor = new RuntimeSupervisor(metrics.runtimeWorkMetrics(), undefined, () => nowMs);
              const ran: string[] = [];

              const blocker = supervisor.admit({
                id: "blocker", lane: "p3", key: "market:m1", estimatedBytes: 10, critical: false,
                expiresAtMs: 10_000,
                run: async () => { ran.push("blocker"); await hold; },
              });
              const staleP0 = supervisor.admit({
                id: "stale-p0", lane: "p0", key: "market:m1", estimatedBytes: 10, critical: true,
                expiresAtMs: 2_000,
                run: async () => { ran.push("stale-p0"); },
              });
              const freshP0 = supervisor.admit({
                id: "fresh-p0", lane: "p0", key: "market:m1", estimatedBytes: 10, critical: true,
                expiresAtMs: 8_000,
                run: async () => { ran.push("fresh-p0"); },
              });
              const laterP3 = supervisor.admit({
                id: "later-p3", lane: "p3", key: "market:m1", estimatedBytes: 10, critical: false,
                expiresAtMs: 8_000,
                run: async () => { ran.push("later-p3"); },
              });

              await waitFor(() => ran.includes("blocker"));
              nowMs = 3_000;
              release();
              await Promise.all([blocker.done, staleP0.done, freshP0.done, laterP3.done]);

              expect(ran).toEqual(["blocker", "fresh-p0", "later-p3"]);
              expect(await metricValue(metrics, "runtime_work_expired_total", "p0")).toBe(1);
              expect(supervisor.snapshot().totalQueued).toBe(0);
            });

            it("prunes expired queued work before the lane hard-cap admission check", async () => {
              let nowMs = 1_000;
              let release!: () => void;
              const hold = new Promise<void>((resolve) => { release = resolve; });
              const supervisor = new RuntimeSupervisor(undefined, undefined, () => nowMs);

              const blocker = supervisor.admit({
                id: "blocker", lane: "p3", key: "market:blocked", estimatedBytes: 1, critical: false,
                expiresAtMs: 10_000,
                run: () => hold,
              });
              const stale = supervisor.admit({
                id: "stale", lane: "p3", key: "market:blocked", estimatedBytes: 1, critical: false,
                expiresAtMs: 2_000,
                run: async () => { throw new Error("stale work must not run"); },
              });

              nowMs = 3_000;
              const fresh = supervisor.admit({
                id: "fresh", lane: "p3", key: "market:fresh", estimatedBytes: 1, critical: false,
                expiresAtMs: 9_000,
                run: async () => undefined,
              });

              expect(fresh.admitted).toBe(true);
              await fresh.done;
              await stale.done;
              release();
              await blocker.done;
              expect(supervisor.snapshot().totalQueued).toBe(0);
            });
          });
          TS

          rm .github/workflows/temp-expired-trigger-patch.yml

          git diff --check
          git status --short

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/engine/src/runtime-supervisor.ts apps/engine/src/engine.ts apps/engine/src/metrics.ts tests/runtime-expired-work.test.ts .github/workflows/temp-expired-trigger-patch.yml
          git commit -m "fix(runtime): drop expired trigger backlog before execution"
          git push origin HEAD:fix/runtime-drop-expired-trigger-backlog
