name: temp-expired-trigger-patch

on:
  push:
    branches:
      - fix/runtime-drop-expired-trigger-backlog

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-drop-expired-trigger-backlog
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/temp_apply_expiry.py
      - name: Verify and commit
        shell: bash
        run: |
          rm .github/workflows/temp-expired-trigger-patch.yml
          rm .github/scripts/temp_apply_expiry.py
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(runtime): drop expired trigger backlog before execution"
          git push origin HEAD:fix/runtime-drop-expired-trigger-backlog
