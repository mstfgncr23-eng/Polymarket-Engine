name: Fly engine deploy

# Manual only. Ordinary PR CI (.github/workflows/ci.yml) does not use FLY_API_TOKEN.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Validate Fly engine config
        run: flyctl config validate -c fly.engine.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy engine (singleton paper machine)
        run: flyctl deploy --config fly.engine.toml --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
