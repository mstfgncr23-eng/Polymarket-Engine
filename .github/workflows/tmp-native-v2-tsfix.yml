name: tmp-native-v2-tsfix

on:
  push:
    branches:
      - feature/native-v2-shadow-features

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-v2-shadow-features
          fetch-depth: 0
      - run: python3 .tmp/fix_native_v2_types.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/src/native-v2-shadow-features.ts
          git commit -m "fix(core): narrow shadow velocity history state"
          git push origin HEAD:feature/native-v2-shadow-features
