name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres-step4:
        image: postgres:17
        env:
          POSTGRES_USER: step4
          POSTGRES_PASSWORD: step4
          POSTGRES_DB: step4_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U step4 -d step4_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STEP4_TEST_DATABASE_URL: postgres://step4:step4@127.0.0.1:5432/step4_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec tsc -p tsconfig.tests.json
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke
      # Live Polymarket/Binance smokes are operator/manual. They need no repo secrets but are network-flaky.

  engine-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build engine image
        run: docker build -f Dockerfile.engine -t polymarket-engine:ci .
      - name: Report directory writable as engine user
        run: >
          docker run --rm --user engine --entrypoint sh polymarket-engine:ci -c
          'test "$(id -un)" = engine && test -w /app/reports && touch /app/reports/.writable && test -f /app/reports/.writable'

  dashboard-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dashboard standalone image
        run: docker build -f Dockerfile.dashboard -t polymarket-dashboard:ci .
