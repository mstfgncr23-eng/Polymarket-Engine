name: Native restore entry-race one-shot patcher

on:
  push:
    branches: [restore/native-baseline]

permissions:
  contents: write

jobs:
  patch-entry-race:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restore/native-baseline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backport native close-vs-entry race fence
        run: node scripts/native-restore-backport-entry-race.mjs
      - name: Commit patch if needed
        run: |
          if git diff --quiet -- apps/engine/src/engine.ts; then
            echo 'No entry-race patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/engine/src/engine.ts
          git commit -m 'fix(native-restore): linearize close entries with first-leg admission'
          git push origin HEAD:restore/native-baseline
