name: tmp-native-v2-format

on:
  push:
    branches:
      - feature/native-v2-shadow-features

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-v2-shadow-features
          fetch-depth: 0
      - run: python3 .tmp/fix_native_v2_indent.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/engine/src/engine.ts
          git commit -m "style(engine): align shadow reference reset"
          git push origin HEAD:feature/native-v2-shadow-features
