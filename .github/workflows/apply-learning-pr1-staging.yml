name: apply-learning-pr1-staging
on:
  workflow_dispatch:
  push:
    branches: [feat/native-v2-learning-foundation]
    paths:
      - "scripts/learning-pr1-staging/TRIGGER_ASSEMBLE"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-v2-learning-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Assemble staged learning PR1 files
        run: node scripts/learning-pr1-staging/assemble.mjs
      - name: Remove staging helpers
        run: |
          rm -rf scripts/learning-pr1-staging
          rm -f .github/workflows/apply-learning-pr1-staging.yml
      - name: Commit assembled files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "$(cat <<'MSG'
feat(learning): LearningSampleStore, engine hook, foundation tests

Assemble PR1 durable learning foundation. Fail-soft observe after V2 fair
probability (before opportunity/ranking); non-economic pollLearningSettlements;
LEARNING_ENABLED default false.
MSG
)"
          git push
