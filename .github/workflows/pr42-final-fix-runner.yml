name: PR42 Final Fix Runner

on:
  push:
    branches:
      - automation/pr42-final-fix-runner

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: step4
          POSTGRES_PASSWORD: step4
          POSTGRES_DB: step4_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U step4 -d step4_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STEP4_TEST_DATABASE_URL: postgres://step4:step4@127.0.0.1:5432/step4_test
    steps:
      - name: Checkout runner assets
        uses: actions/checkout@v4
        with:
          ref: automation/pr42-final-fix-runner
          path: runner

      - name: Checkout exact PR42 head
        uses: actions/checkout@v4
        with:
          ref: feat/prepare-next-paper-experiment
          fetch-depth: 0
          path: work

      - name: Assert expected parent
        working-directory: work
        run: |
          test "$(git rev-parse HEAD)" = "5451e5bb32484ce1665a78117ab517f5e73e99c1"
          test -z "$(git status --porcelain)"

      - name: Apply bounded lifecycle fix
        working-directory: work
        run: |
          python3 ../runner/.github/scripts/pr42_final_fix.py
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' apps/engine/src/engine.ts tests/operator-prepare-next.test.ts | sort)"
          git diff --stat

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: work/pnpm-lock.yaml

      - name: Install
        working-directory: work
        run: pnpm install --frozen-lockfile

      - name: Focused correctness tests
        working-directory: work
        run: pnpm exec vitest run tests/operator-prepare-next.test.ts tests/stability-trigger-hot-path.test.ts tests/astra-final-correctness.test.ts

      - name: Typecheck
        working-directory: work
        run: pnpm typecheck

      - name: Lint
        working-directory: work
        run: pnpm lint

      - name: Full test suite with PG17
        working-directory: work
        run: pnpm test

      - name: Build
        working-directory: work
        run: pnpm build

      - name: Smoke
        working-directory: work
        run: pnpm smoke

      - name: Commit verified fix to isolated result branch
        working-directory: work
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b automation/pr42-final-fix-result
          git add apps/engine/src/engine.ts tests/operator-prepare-next.test.ts
          git commit -m "fix(lifecycle): freeze trigger admission across prepare boundary"
          git push --force origin HEAD:refs/heads/automation/pr42-final-fix-result
