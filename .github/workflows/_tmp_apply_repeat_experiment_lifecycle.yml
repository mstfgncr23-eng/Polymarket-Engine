name: temporary repeat experiment lifecycle patch

on:
  push:
    branches:
      - fix/repeat-experiment-lifecycle

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/repeat-experiment-lifecycle
          fetch-depth: 0

      - name: Apply narrow lifecycle patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          root = Path('.')

          engine_path = root / 'apps/engine/src/engine.ts'
          engine = engine_path.read_text()
          old_engine = '''      if (this.experiment?.status === "COMPLETED" || this.experiment?.status === "FAILED") {
                return { ok: false, blockers: ["EXPERIMENT_ALREADY_COMPLETED"], experiment: this.experiment };
              }
          '''
          new_engine = '''      if (this.experiment?.status === "FAILED") {
                return { ok: false, blockers: ["EXPERIMENT_ALREADY_COMPLETED"], experiment: this.experiment };
              }
              if (this.experiment?.status === "COMPLETED") {
                const previousReport = await this.journal
                  .loadExperimentReport(this.experiment.id, "final")
                  .catch(() => null);
                if (!previousReport || !isCanonicalFinalReport(previousReport)) {
                  return {
                    ok: false,
                    blockers: ["PREVIOUS_EXPERIMENT_REPORT_NOT_FINALIZED"],
                    experiment: this.experiment,
                  };
                }
              }
          '''
          if engine.count(old_engine) != 1:
              raise SystemExit(f'ENGINE_PATCH_ABORT: expected 1 lifecycle block, found {engine.count(old_engine)}')
          engine_path.write_text(engine.replace(old_engine, new_engine))

          recovery_path = root / 'apps/engine/src/recovery.ts'
          recovery = recovery_path.read_text()
          old_recovery = '''    case "EXPERIMENT_STARTED":
              case "EXPERIMENT_START_VALIDATED":
              case "EXPERIMENT_START_ABORTED":
              case "EXPERIMENT_ENTRY_CLOSED":
              case "EXPERIMENT_COMPLETED":
                  state.experiment = experimentManifestSchema.parse(transition.payload.experiment ?? transition.payload);
                  if (transition.type === "EXPERIMENT_STARTED") {
                    const at = state.experiment.startedAt ? new Date(state.experiment.startedAt) : new Date(transition.occurredAt);
                    state.ledger.resetOperatingCostBaseline(at);
                    state.lastInfrastructureAccrualAt = at.getTime();
                  }
                  return;
          '''
          new_recovery = '''    case "EXPERIMENT_STARTED":
              case "EXPERIMENT_START_VALIDATED":
              case "EXPERIMENT_START_ABORTED":
              case "EXPERIMENT_ENTRY_CLOSED":
              case "EXPERIMENT_COMPLETED":
                  state.experiment = experimentManifestSchema.parse(transition.payload.experiment ?? transition.payload);
                  if (transition.type === "EXPERIMENT_STARTED") {
                    const at = state.experiment.startedAt ? new Date(state.experiment.startedAt) : new Date(transition.occurredAt);
                    const ledger = state.ledger.snapshot();
                    const openPosition = [...state.ledger.positions.values()].some(
                      (position) => d(position.upQuantity).gt(0) || d(position.downQuantity).gt(0),
                    );
                    const restingOrder = [...state.restingOrders.values()].some(
                      (order) => d(order.remaining).gt(0),
                    );
                    const makerReservation = [...state.makerReservations.values()].some(
                      (amount) => d(amount).gt(0),
                    );
                    if (openPosition || restingOrder || makerReservation || d(ledger.reservedCash).gt(0)) {
                      throw new RecoveryFailClosedError(
                        "invariant",
                        "experiment start attempted with economic residue",
                      );
                    }

                    const fresh = new PaperLedger(state.experiment.startingBalance, at);
                    state.ledger.restore(fresh.snapshot(), []);
                    state.restingOrders.clear();
                    state.makerReservations.clear();
                    state.lastInfrastructureAccrualAt = at.getTime();
                  }
                  return;
          '''
          if recovery.count(old_recovery) != 1:
              raise SystemExit(f'RECOVERY_PATCH_ABORT: expected 1 start block, found {recovery.count(old_recovery)}')
          recovery_path.write_text(recovery.replace(old_recovery, new_recovery))

          test_path = root / 'tests/repeat-experiment-lifecycle.test.ts'
          test_path.write_text(r'''import { describe, expect, it } from "vitest";
          import { paperFill, startQualifiedEngine } from "./paper-engine-testkit.js";

          function installCompletedExperiment(engine: Awaited<ReturnType<typeof startQualifiedEngine>>["engine"], id: string) {
            const current = engine.experimentManifest();
            if (!current) throw new Error("missing experiment manifest");
            const at = new Date().toISOString();
            const completed = {
              ...current,
              id,
              status: "COMPLETED" as const,
              startedAt: at,
              entryClosesAt: at,
              completedAt: at,
              startValidationPending: false,
            };

            (engine as unknown as { experiment: typeof completed }).experiment = completed;
            engine.state.experimentId = id;
            engine.state.experimentStatus = "COMPLETED";

            return completed;
          }

          describe("repeat experiment lifecycle", () => {
            it("keeps a completed experiment closed until its canonical final report exists", async () => {
              const { engine, journal } = await startQualifiedEngine();

              try {
                const previous = installCompletedExperiment(engine, "experiment-previous");

                (journal as unknown as {
                  loadExperimentReport: (id: string, kind?: "final") => Promise<unknown>;
                }).loadExperimentReport = async () => null;

                const result = await engine.beginExperiment();

                expect(result.ok).toBe(false);
                expect(result.blockers).toEqual(["PREVIOUS_EXPERIMENT_REPORT_NOT_FINALIZED"]);
                expect(engine.experimentManifest()?.id).toBe(previous.id);
                expect(engine.experimentManifest()?.status).toBe("COMPLETED");
              } finally {
                await engine.stop();
              }
            });

            it("starts a new clean experiment after a finalized completed experiment", async () => {
              const { engine, journal } = await startQualifiedEngine();

              try {
                const previous = installCompletedExperiment(engine, "experiment-previous");

                engine.ledger.applyFill(paperFill("btc-mkt", "UP", "0.40"));
                engine.ledger.settlePosition("btc-mkt", "0", "1");

                const before = engine.ledger.snapshot();
                expect(engine.ledger.positions.size).toBe(0);
                expect(before.cash).not.toBe(before.startingBalance);
                expect(before.realizedPnl).not.toBe("0");

                (journal as unknown as {
                  loadExperimentReport: (id: string, kind?: "final") => Promise<unknown>;
                }).loadExperimentReport = async (id: string) => (
                  id === previous.id
                    ? {
                        experimentId: previous.id,
                        reportKind: "final",
                        complete: true,
                        truncated: false,
                      }
                    : null
                );

                const result = await engine.beginExperiment();

                expect(result.ok).toBe(true);

                const next = engine.experimentManifest();
                expect(next?.status).toBe("RUNNING");
                expect(next?.id).not.toBe(previous.id);

                const after = engine.ledger.snapshot();
                expect(engine.ledger.positions.size).toBe(0);
                expect(after.cash).toBe(after.startingBalance);
                expect(after.reservedCash).toBe("0");
                expect(after.realizedPnl).toBe("0");
                expect(after.unrealizedPnl).toBe("0");
                expect(after.grossPnl).toBe("0");
                expect(after.fees).toBe("0");
                expect(after.slippage).toBe("0");
                expect(after.drawdown).toBe("0");
              } finally {
                await engine.stop();
              }
            });
          });
          ''')

          for path in (engine_path, recovery_path, test_path):
              text = path.read_text()
              lines = [line[10:] if line.startswith('          ') else line for line in text.splitlines()]
              path.write_text('\n'.join(lines) + '\n')

          print('PATCH_OK')
          PY

          git diff --check
          git status --short

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/_tmp_apply_repeat_experiment_lifecycle.yml
          git add apps/engine/src/engine.ts apps/engine/src/recovery.ts tests/repeat-experiment-lifecycle.test.ts .github/workflows/_tmp_apply_repeat_experiment_lifecycle.yml
          git diff --cached --check
          git commit -m "fix(engine): allow safe repeat paper experiments"
          git push origin HEAD:refs/heads/fix/repeat-experiment-lifecycle
