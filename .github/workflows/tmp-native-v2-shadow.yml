name: tmp-native-v2-shadow

on:
  push:
    branches:
      - feature/native-v2-shadow-features

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-v2-shadow-features
          fetch-depth: 0
      - name: Apply exact EngineService shadow wiring
        run: python3 .tmp/apply_native_v2_shadow.py
      - name: Validate diff
        run: |
          git diff --check
          git diff -- apps/engine/src/engine.ts
      - name: Commit EngineService wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/engine/src/engine.ts
          git commit -m "feat(engine): attach native v2 shadow features"
          git push origin HEAD:feature/native-v2-shadow-features
