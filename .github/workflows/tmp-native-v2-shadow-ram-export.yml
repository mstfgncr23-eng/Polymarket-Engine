name: tmp-native-v2-shadow-ram-export

on:
  push:
    branches:
      - feature/native-v2-shadow-full-execution

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-v2-shadow-full-execution
          fetch-depth: 0
      - run: python3 .tmp/apply_native_v2_shadow_ram_export.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/engine/src/engine.ts apps/engine/src/server.ts apps/engine/src/runtime.ts
          git commit -m "feat(engine): add bounded native v2 RAM shadow export"
          git push origin HEAD:feature/native-v2-shadow-full-execution
