name: tmp-postgres-session-pool-stability
on:
  push:
    branches:
      - fix/postgres-session-pool-stability
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/postgres-session-pool-stability
      - run: python3 .tmp/patch_postgres_session_pool.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/db/src/journal.ts tests/postgres-session-pool-config.test.ts
          git commit -m "fix(db): keep long-lived postgres sessions warm"
          git push origin HEAD:fix/postgres-session-pool-stability
