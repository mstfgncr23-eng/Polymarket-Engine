name: tmp-native-report-semantics

on:
  push:
    branches:
      - fix/native-report-semantics

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-report-semantics
          fetch-depth: 0

      - name: Apply exact report semantics patch
        run: python3 .tmp/apply_report_semantics.py

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/engine/src/report.ts tests/report-semantics.test.ts
          git diff --cached --check
          git commit -m "fix(report): correct native experiment semantics"
          git push origin HEAD:fix/native-report-semantics
